<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>October 2026: The world today, as seen by just another Polish guy</title>
<meta name="description" content="A reply to “September 2026: the world today”. The same map and the same month, told through the other half of the data: Poland in its best years.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Semi+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --surface:#05070a;
  --land:#0d1117;
  --land-edge:rgba(255,255,255,.16);
  --ink:#fff;
  --ink-2:rgba(255,255,255,.72);
  --ink-3:rgba(255,255,255,.46);
  --line:rgba(255,255,255,.14);
  --line-2:rgba(255,255,255,.28);
  --pl:#f03a4e;          /* Poland: the focus mark */
  --pl-soft:rgba(240,58,78,.18);
  --ctx:#7d8aa0;         /* comparison marks: deliberately recessive */
  --glow:#ffd9a8;        /* light on the map: energy, people, flows */
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut:clamp(16px,4vw,56px);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:dark} /* the piece is night-side by design; a light theme is not offered */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }

*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--pl);color:#fff}

/* ---------- stage: the map behind everything ---------- */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 70% 40%,#070b12 0%,#000 70%)}
#map,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#map .grat path{fill:none;stroke:rgba(255,255,255,.05);stroke-width:1;vector-effect:non-scaling-stroke}
#map .land path{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .9s ease,stroke .9s ease}
#map .land path.hi{fill:#2a0d13;stroke:var(--pl);stroke-width:1.4}
#map .land path.hi2{fill:#161c26;stroke:rgba(255,255,255,.42);stroke-width:.9}
#stage[data-dim="1"] #map .land path:not(.hi){fill:#080a0e}
#scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.78) 440px,rgba(0,0,0,0) 640px),
             linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 22%),
             linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 14%)}
#stage[data-hero="1"] #scrim{background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 35%)}
#tip{position:fixed;z-index:30;max-width:280px;padding:12px 14px;background:rgba(5,7,10,.94);border:1px solid var(--line-2);font:400 13px/1.45 var(--sans);color:var(--ink-2);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:none}
#tip b{display:block;font:500 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin-bottom:6px}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;z-index:20;pointer-events:none;font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hud a,.hud button{pointer-events:auto}
#top{top:0;display:flex;align-items:center;gap:28px;padding:18px var(--gut);background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
.brand{font:600 15px/1 var(--cond);letter-spacing:.32em;color:var(--ink);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:12px}
.brand i{display:inline-block;width:18px;height:12px;background:linear-gradient(#fff 50%,var(--pl) 50%)}
#nav{display:flex;gap:22px;flex:1;justify-content:center;overflow:hidden}
#nav a{color:var(--ink-3);text-decoration:none;font:500 12px/1 var(--cond);letter-spacing:.2em;padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap}
#nav a:hover{color:var(--ink)}
#nav a.on{color:var(--ink);border-color:var(--ink)}
.lang{display:flex;border:1px solid var(--line-2)}
.lang button{all:unset;pointer-events:auto;cursor:pointer;padding:8px 12px;font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink-3)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#000}
.lang button:focus-visible{outline:1px solid var(--pl);outline-offset:2px}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--pl);z-index:21}
#bottom{bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:16px var(--gut) 18px}
.tele{display:flex;gap:26px;align-items:flex-end}
.tele div{display:flex;flex-direction:column;gap:7px}
.tele small{font-size:9px;color:var(--ink-3)}
.tele span{color:var(--ink)}
#scalebar{height:6px;border:1px solid var(--ink-2);border-top:none;width:80px;transition:width .3s}
.tminus{text-align:right}
.tminus span{font-size:13px;letter-spacing:.08em}
#chap{color:var(--ink)}

/* ---------- story ---------- */
#story{position:relative;z-index:10;pointer-events:none}
.step{min-height:100vh;display:flex;align-items:center;padding:110px var(--gut) 90px}
.step--chapter{min-height:90vh}
.card{pointer-events:auto;width:min(470px,100%);position:relative}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--line-2);pointer-events:none}
.card::before{top:-14px;left:-14px;border-right:none;border-bottom:none}
.card::after{bottom:-14px;right:-14px;border-left:none;border-top:none}
.step--hero .card::before,.step--hero .card::after,.step--chapter .card::before,.step--chapter .card::after{display:none}
.kicker{font:500 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:10px;margin:0 0 14px}
.kicker::before{content:"";width:6px;height:6px;background:var(--pl);border-radius:50%;box-shadow:0 0 10px var(--pl);flex:none}
h1,h2,h3{font-family:var(--cond);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.02;text-wrap:balance}
h2{font-size:clamp(28px,3.1vw,40px);margin-bottom:18px}
.body{color:var(--ink-2);font-size:16.5px;line-height:1.62}
.body p{margin:0 0 14px}
.body b,.body strong{color:var(--ink);font-weight:500}
.caveat{margin:16px 0 0;padding:10px 0 0 14px;border-left:1px solid var(--line-2);font:400 13px/1.5 var(--sans);color:var(--ink-3)}
.caveat::before{content:attr(data-label);display:block;font:500 9.5px/1 var(--mono);letter-spacing:.18em;margin-bottom:6px;color:var(--ink-3)}
.fig{margin:22px 0 4px}
.fig + .fig{margin-top:26px}
.figt{font:500 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;display:flex;justify-content:space-between;gap:12px}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font:400 10.5px/1.5 var(--mono);letter-spacing:.06em;color:var(--ink-3)}
.badge{border:1px solid var(--line-2);padding:3px 7px;letter-spacing:.14em;text-transform:uppercase;font-size:9.5px;color:var(--ink-2)}
.meta details{width:100%}
.meta summary{cursor:pointer;list-style:none;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.meta summary::-webkit-details-marker{display:none}
.meta summary::after{content:"+";font-size:13px}
.meta details[open] summary::after{content:"−"}
.meta ol{margin:10px 0 0;padding-left:18px;line-height:1.55}
.meta ol a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.meta ol a:hover{color:var(--ink);border-color:var(--ink)}

/* hero */
.step--hero{align-items:flex-end;padding-bottom:16vh}
.step--hero .card{width:min(820px,100%)}
.hero-eyebrow{font:500 12px/1.4 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);margin-bottom:22px;display:flex;gap:14px;align-items:center}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pl);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-size:clamp(34px,5.2vw,76px);letter-spacing:.02em;line-height:.95;margin-bottom:24px}
h1 em{font-style:normal;color:var(--pl)}
a.orig-link{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--pl);pointer-events:auto}
a.orig-link:hover{color:var(--pl)}
.hero-sub{font:500 clamp(22px,2.6vw,36px)/1.1 var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:-6px 0 24px;color:var(--ink)}
.hero-sub em{font-style:normal;color:var(--pl)}
.lede{font:300 clamp(18px,1.6vw,22px)/1.5 var(--sans);color:var(--ink-2);max-width:640px;margin:0 0 30px}
.byline{font:400 11px/1.6 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.scrollcue{margin-top:40px;display:inline-flex;align-items:center;gap:14px;font:500 11px/1 var(--mono);letter-spacing:.24em;color:var(--ink-2);text-transform:uppercase}
.scrollcue i{width:1px;height:38px;background:linear-gradient(var(--ink),transparent);position:relative;overflow:hidden}
.scrollcue i::after{content:"";position:absolute;left:-2px;top:-8px;width:5px;height:8px;background:var(--pl);animation:drop 1.8s infinite}
@keyframes drop{to{top:40px}}

/* chapter openers */
.chapno{font:500 clamp(80px,12vw,170px)/.8 var(--cond);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.5);letter-spacing:.02em;margin-bottom:24px}
.orig{font:400 11px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.orig s{color:var(--ink-3);text-decoration-color:var(--pl);text-decoration-thickness:1px}
.step--chapter h2{font-size:clamp(38px,5vw,68px)}
.step--chapter .lede{margin-top:6px}

/* buttons */
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font:500 12px/1 var(--cond);letter-spacing:.22em;text-transform:uppercase;transition:background .2s,color .2s}
.btn:hover,.btn:focus-visible{background:var(--ink);color:#000;outline:none}
.btn--ghost{border-color:var(--line-2);color:var(--ink-2)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:rgba(0,0,0,.82);padding:14px 14px 13px;position:relative}
.kpi .v{font:500 clamp(24px,2.3vw,32px)/1 var(--cond);letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.kpi .v.pl{color:var(--ink)}
.kpi .l{font:400 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--ink-3);margin-top:8px;text-transform:uppercase}
.kpi::after{content:"";position:absolute;top:10px;right:10px;width:4px;height:4px;border-radius:50%;background:var(--pl);opacity:0}
.run .kpi::after{animation:blink 2.2s infinite;opacity:1}
.hero-kpis{margin-top:4px;max-width:760px}
.hero-kpis.kpis{grid-template-columns:repeat(4,1fr)}

/* svg chart marks */
.trk{stroke:rgba(255,255,255,.09)}
.mk-pl{stroke:var(--pl);fill:var(--pl)}
.mk-ctx{stroke:var(--ctx);fill:var(--ctx)}
.tl{fill:var(--ink-2);font:400 12px var(--sans)}
.tl.b{fill:var(--ink);font-weight:500}
.tv{fill:var(--ink);font:500 13px var(--mono)}
.tm{fill:var(--ink-3);font:400 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ptc{fill:#fff;opacity:0;transition:opacity .4s}
.run .ptc{opacity:.9}
.dot-off{fill:none;stroke:rgba(255,255,255,.22)}
.wd{transition:fill .35s ease,stroke .35s ease}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.45}}

/* day timeline */
.day{position:relative;margin:4px 0 0;padding:0 0 0 30px;list-style:none}
.day::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.day li{position:relative;padding:0 0 15px;opacity:0;transform:translateX(-6px);transition:opacity .5s,transform .5s}
.run .day li{opacity:1;transform:none}
.day li::before{content:"";position:absolute;left:-28px;top:6px;width:9px;height:9px;border:1px solid var(--ink);background:#000;border-radius:50%}
.day time{font:500 11px/1 var(--mono);letter-spacing:.12em;color:var(--ink);display:block;margin-bottom:4px}
.day span{font-size:14px;color:var(--ink-2)}
.day .runner{position:absolute;left:3.5px;top:0;width:6px;height:6px;border-radius:50%;background:var(--pl);box-shadow:0 0 12px var(--pl);padding:0}
.day .runner::before{display:none}
.run .day .runner{animation:run 6s linear infinite}
@keyframes run{from{top:0}to{top:calc(100% - 6px)}}

/* ledger */
.ledger{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.ledger .row{display:grid;grid-template-columns:1fr 1fr;gap:1px}
.ledger .row>div{background:rgba(0,0,0,.85);padding:12px}
.ledger .hd>div{font:500 9.5px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px}
.ledger h4{margin:0 0 4px;font:500 13px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.ledger p{margin:0;font-size:13px;line-height:1.45;color:var(--ink-2)}
.ledger .good p{color:var(--ink)}
.ledger .good p::before{content:"↗ ";color:var(--pl)}

/* sources */
#sources{position:relative;z-index:10;background:#000;border-top:1px solid var(--line);padding:80px var(--gut) 120px}
#sources h2{font-size:28px}
#sources .cols{columns:3 300px;column-gap:40px;margin-top:30px;font:400 12px/1.55 var(--mono);color:var(--ink-3)}
#sources .cols a{color:var(--ink-2);text-decoration:none;display:block;break-inside:avoid;margin-bottom:10px}
#sources .cols a:hover{color:var(--ink)}
#sources .note{max-width:760px;color:var(--ink-3);font-size:14px}

/* table fallback for screen readers */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- small screens ---------- */
@media (max-width:1399px){ #nav{gap:14px} #nav a{letter-spacing:.12em;font-size:11px} }
@media (max-width:1179px){ #nav{visibility:hidden} }
@media (max-width:899px){
  #nav{display:none}
  #top{justify-content:space-between;padding:14px 16px}
  .brand{font-size:13px;letter-spacing:.24em}
  #scrim,#stage[data-hero="1"] #scrim{background:linear-gradient(0deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.82) 42%,rgba(0,0,0,0) 62%),linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 14%)}
  .step{align-items:flex-end;padding:52vh 16px 80px;min-height:100vh}
  .step--hero{padding-top:40vh;padding-bottom:12vh}
  .card{width:100%;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:22px 18px 20px;margin:0 -2px;border-top:1px solid var(--line-2)}
  .step--hero .card,.step--chapter .card{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;padding:0}
  .card::before,.card::after{display:none}
  .tele .hide-m{display:none}
  #bottom{padding:18px 16px 10px;background:linear-gradient(0deg,#000 55%,rgba(0,0,0,0))}
  .hero-kpis.kpis{grid-template-columns:repeat(2,1fr)}
  .kpis.k3{grid-template-columns:repeat(2,1fr)}
  body{font-size:16px}
  .body{font-size:15.5px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage" data-hero="1">
  <svg id="map" aria-hidden="true"></svg>
  <canvas id="fx" aria-label="Map"></canvas>
  <div id="scrim"></div>
</div>
<div id="tip" role="tooltip"></div>

<header class="hud" id="top">
  <a class="brand" href="#s-hero"><i></i><span>POLSKA · 2026</span></a>
  <nav id="nav" aria-label="Chapters"></nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="pl" aria-pressed="false">PL</button>
  </div>
</header>

<div class="hud" id="bottom" aria-hidden="true">
  <div class="tele">
    <div><small data-i="lat">Position</small><span id="coords">52°13′N 21°00′E</span></div>
    <div class="hide-m"><small data-i="alt">Altitude</small><span id="alt">—</span></div>
    <div class="hide-m"><small data-i="scale">Scale</small><span><b id="scalebar"></b></span><span id="scaletext" style="margin-top:4px">—</span></div>
  </div>
  <div class="tele">
    <div class="hide-m"><small data-i="chapter">Chapter</small><span id="chap">—</span></div>
    <div class="tminus"><small data-i="tplus">T+ since EU accession · 1 May 2004</small><span id="tplus">—</span></div>
  </div>
</div>

<main id="story"></main>

<footer id="sources">
  <h2 data-i="srcTitle">Sources</h2>
  <p class="note" data-i="srcNote"></p>
  <div class="cols" id="srclist"></div>
</footer>

<script id="geo" type="application/json">/*GEO*/</script>
<script id="cards" type="application/json">/*CARDS*/</script>

/* =====================================================================

   ===================================================================== */
var uid = 0;
function fmt(v,c){ return T(c.pre||'') + nf(v,c.dec||0) + T(c.suf||''); }
function countSpan(v,c){ return '<span data-count="'+v+'" data-dec="'+(c.dec||0)+'" data-pre="'+esc(T(c.pre||''))+'" data-suf="'+esc(T(c.suf||''))+'">'+fmt(v,c)+'</span>'; }
function figWrap(ch, inner, table){
  var t = ch.title ? '<div class="figt"><span>'+esc(T(ch.title))+'</span></div>' : '';
  return '<figure class="fig" style="margin-left:0;margin-right:0">'+t+inner+(table?'<table class="sr">'+table+'</table>':'')+'</figure>';
}
var R = {};
R.kpi = function(ch){
  var h = '<div class="kpis'+(ch.cols===3?' k3':'')+'">';
  ch.items.forEach(function(it){ h += '<div class="kpi"><div class="v">'+countSpan(it.v,it)+'</div><div class="l">'+esc(T(it.l))+'</div></div>'; });
  return figWrap(ch, h+'</div>');
};
R.bars = function(ch){
  var W=400, rowH=30, lw=128, x0=lw+8, x1=W-62, n=ch.rows.length, H=n*rowH+(ch.ref?16:2);
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(ch.title))+'">', tb='';
  if (ch.ref){ var rx = x0+(x1-x0)*ch.ref/ch.max; s += '<line x1="'+rx+'" x2="'+rx+'" y1="0" y2="'+(H-14)+'" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 3"/><text class="tm" x="'+rx+'" y="'+(H-2)+'" text-anchor="middle">'+esc(T(ch.refl))+' '+ch.ref+'</text>'; }
  ch.rows.forEach(function(r,i){
    var y = i*rowH+15, xe = x0+(x1-x0)*Math.min(1,r.v/ch.max), cls = r.hl?'mk-pl':'mk-ctx', id='p'+(++uid);
    s += '<text class="tl'+(r.hl?' b':'')+'" x="0" y="'+(y+4)+'">'+esc(T(r.l))+'</text>';
    s += '<line class="trk" x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'" stroke-width="6"/>';
    s += '<line class="'+cls+'" x1="'+x0+'" x2="'+x0+'" y1="'+y+'" y2="'+y+'" stroke-width="6" data-tw="x2" data-from="'+x0+'" data-to="'+xe.toFixed(1)+'" data-i="'+i+'"><title>'+esc(T(r.l))+': '+fmt(r.v,ch)+'</title></line>';
    s += '<circle class="'+cls+'" r="4.5" cx="'+x0+'" cy="'+y+'" data-tw="cx" data-from="'+x0+'" data-to="'+xe.toFixed(1)+'" data-i="'+i+'" stroke="#000" stroke-width="2"/>';
    if (xe-x0 > 24){ for (var k=0;k<2;k++) s += '<circle class="ptc" r="1.3"><animateMotion dur="'+(1.6+k*.7+i*.15).toFixed(2)+'s" begin="'+(k*0.8)+'s" repeatCount="indefinite" path="M'+x0+','+y+' L'+(xe-5).toFixed(1)+','+y+'"/></circle>'; }
    s += '<text class="tv" x="'+(x1+8)+'" y="'+(y+4.5)+'">'+countSpan(r.v,ch).replace('<span','<tspan').replace('</span>','</tspan>')+'</text>';
    tb += '<tr><th>'+esc(T(r.l))+'</th><td>'+fmt(r.v,ch)+'</td></tr>';
  });
  return figWrap(ch, s+'</svg>', tb);
};
R.rings = function(ch){
  var W=400, H=170, cx=85, cy=85, s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(ch.title))+'">', tb='';
  ch.rows.forEach(function(r,i){
    var rad = 74-i*20, C = 2*Math.PI*rad, len = C*r.v/100, cls = r.hl?'mk-pl':'mk-ctx';
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" class="trk" stroke-width="7"/>';
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" class="'+cls+'" stroke-width="7" transform="rotate(-90 '+cx+' '+cy+')" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-tw="stroke-dashoffset" data-from="'+C.toFixed(1)+'" data-to="'+(C-len).toFixed(1)+'" data-i="'+i+'" style="fill:none"/>';
    var a1 = -Math.PI/2 + 2*Math.PI*r.v/100, large = r.v>50?1:0;
    var p = 'M'+cx+','+(cy-rad)+' A'+rad+','+rad+' 0 '+large+' 1 '+(cx+rad*Math.cos(a1)).toFixed(2)+','+(cy+rad*Math.sin(a1)).toFixed(2);
    s += '<circle class="ptc" r="2.2"><animateMotion dur="'+(3+i)+'s" repeatCount="indefinite" path="'+p+'"/></circle>';

    s += '<line x1="190" x2="204" y1="'+(ly-4)+'" y2="'+(ly-4)+'" class="'+cls+'" stroke-width="3"/>';
    s += '<text class="tv" x="214" y="'+ly+'" style="font-size:20px">'+countSpan(r.v,{suf:'%'}).replace('<span','<tspan').replace('</span>','</tspan>')+'</text>';
    s += '<text class="tl'+(r.hl?' b':'')+'" x="214" y="'+(ly+17)+'">'+esc(T(r.l))+'</text>';
    tb += '<tr><th>'+esc(T(r.l))+'</th><td>'+r.v+'%</td></tr>';
  });
  return figWrap(ch, s+'</svg>', tb);
};
R.slope = function(ch){
  var W=400, top=22, bot=26, n=ch.rows.length, H=140, xa=100, xb=300;
  function y(v){ return top+(H-top-bot)*(1-(v-ch.min)/(ch.max-ch.min)); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(ch.title))+'">', tb='';
  s += '<line x1="'+xa+'" x2="'+xa+'" y1="'+top+'" y2="'+(H-bot)+'" stroke="rgba(255,255,255,.18)"/><line x1="'+xb+'" x2="'+xb+'" y1="'+top+'" y2="'+(H-bot)+'" stroke="rgba(255,255,255,.18)"/>';
  s += '<text class="tm" x="'+xa+'" y="'+(H-6)+'" text-anchor="middle">'+esc(T(ch.from))+'</text><text class="tm" x="'+xb+'" y="'+(H-6)+'" text-anchor="middle">'+esc(T(ch.to))+'</text>';
  ch.rows.forEach(function(r,i){
    var ya=y(r.a), yb=y(r.b), cls=r.hl?'mk-pl':'mk-ctx', L=Math.hypot(xb-xa,yb-ya);
    s += '<line class="'+cls+'" x1="'+xa+'" y1="'+ya.toFixed(1)+'" x2="'+xb+'" y2="'+yb.toFixed(1)+'" stroke-width="2" stroke-dasharray="'+L.toFixed(1)+'" stroke-dashoffset="'+L.toFixed(1)+'" data-tw="stroke-dashoffset" data-from="'+L.toFixed(1)+'" data-to="0" data-i="'+i+'"/>';
    s += '<circle class="'+cls+'" cx="'+xa+'" cy="'+ya.toFixed(1)+'" r="4.5" stroke="#000" stroke-width="2"/><circle class="'+cls+'" cx="'+xb+'" cy="'+yb.toFixed(1)+'" r="5.5" stroke="#000" stroke-width="2"/>';
    s += '<circle class="ptc" r="2"><animateMotion dur="2.6s" begin="'+(i*.5)+'s" repeatCount="indefinite" path="M'+xa+','+ya.toFixed(1)+' L'+xb+','+yb.toFixed(1)+'"/></circle>';
    s += '<text class="tv" x="'+(xa-10)+'" y="'+(ya+4).toFixed(1)+'" text-anchor="end" style="fill:var(--ink-2)">'+esc(fmt(r.a,ch))+'</text>';
    s += '<text class="tv" x="'+(xb+12)+'" y="'+(yb+4).toFixed(1)+'">'+countSpan(r.b,ch).replace('<span','<tspan').replace('</span>','</tspan>')+'</text>';
    if (n>1 || T(r.l)!==T(ch.title)) s += '<text class="tl" x="'+((xa+xb)/2)+'" y="'+((ya+yb)/2-9).toFixed(1)+'" text-anchor="middle">'+esc(T(r.l))+'</text>';
    tb += '<tr><th>'+esc(T(r.l))+'</th><td>'+esc(T(ch.from))+': '+fmt(r.a,ch)+'</td><td>'+esc(T(ch.to))+': '+fmt(r.b,ch)+'</td></tr>';
  });
  return figWrap(ch, s+'</svg>', tb);
};
R.waffles = function(ch){
  var n = ch.items.length, cell=13, gW=cell*10, gap=40, W=Math.max(400,n*gW+(n-1)*gap), H=gW+38;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(ch.title))+'">', tb='';
  ch.items.forEach(function(it,j){
    var ox = j*(gW+gap);

      var c=i%10, r=9-Math.floor(i/10), lit = i<it.v;
      s += '<circle class="wd dot-off" data-lit="'+(lit?(it.hl?'pl':'ctx'):'')+'" data-d="'+i+'" cx="'+(ox+c*cell+cell/2)+'" cy="'+(r*cell+cell/2)+'" r="4.4"'+(lit && i%7===3?' data-tw2="1"':'')+'/>';
    }
    s += '<text class="tv" x="'+ox+'" y="'+(gW+20)+'" style="font-size:18px">'+countSpan(it.v,{suf:'%'}).replace('<span','<tspan').replace('</span>','</tspan>')+'</text>';
    s += '<text class="tl" x="'+ox+'" y="'+(gW+35)+'">'+esc(T(it.l))+'</text>';
    tb += '<tr><th>'+esc(T(it.l))+'</th><td>'+it.v+' / 100</td></tr>';
  });
  return figWrap(ch, s+'</svg>', tb);

  var hi=VIEWS[name].hi||{};
  Object.keys(landById).forEach(function(id){ var c=hi[id]||''; if (landById[id].getAttribute('class')!==c) landById[id].setAttribute('class',c); });
  if (VIEWS[name].euHi){ ['276','250','380','724','620','528','056','040','203','703','348','642','100','300','752','246','233','428','440','208','372','191','705','196','470','442'].forEach(function(id){ if (landById[id] && !hi[id]) landById[id].setAttribute('class','hi2'); }); }
  stage.setAttribute('data-dim', VIEWS[name].dim?'1':'0');
  hideTip();
  flyTo(name, instant);
}
var NICE=[5,10,20,50,100,200,500,1000,2000,5000];
function dms(v,pos,neg){ var a=Math.abs(v), d=Math.floor(a), m=Math.round((a-d)*60); if(m===60){d++;m=0;} return d+'°'+(m<10?'0':'')+m+'′'+(v>=0?pos:neg); }
function updateMeta(){
  if (!cur) return; var f=focusRect(active), ll=Pinv([(f.x+f.w/2-tx)/cur.k,(f.y+f.h/2-ty)/cur.k]);
  var kmPerPx=6371*Math.cos(ll[1]*RAD)/(S0*cur.k), km=NICE[0]; NICE.forEach(function(n){ if (n/kmPerPx<=110) km=n; });
  $('#scalebar').style.width=Math.round(km/kmPerPx)+'px'; $('#scaletext').textContent=nf(km)+' km';
  $('#coords').textContent=dms(ll[1],'N','S')+' '+dms(ll[0],'E','W');
  $('#alt').textContent=nf(Math.round(W*kmPerPx*0.62/10)*10)+' km';
}

/* ---------- canvas drawing ---------- */
function S(b){ return [tx+cur.k*b[0], ty+cur.k*b[1]]; }
function routeLen(r){ if (r.L) return; r.L=[0]; for (var i=1;i<r.p.length;i++) r.L.push(r.L[i-1]+Math.hypot(r.p[i][0]-r.p[i-1][0], r.p[i][1]-r.p[i-1][1])); }
function along(r,t){ var L=t*r.L[r.L.length-1], j=1; while (j<r.L.length-1 && r.L[j]<L) j++; var u=(L-r.L[j-1])/((r.L[j]-r.L[j-1])||1), a=r.p[j-1], b=r.p[j]; return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]; }
function approach(x,target,dt){ if (reduced) return target; return x+(target-x)*Math.min(1,dt*3.2); }
function glowDot(x,y,r,rgb,al){
  var g=ctx.createRadialGradient(x,y,0,x,y,r*4); g.addColorStop(0,'rgba('+rgb+','+(.7*al)+')'); g.addColorStop(1,'rgba('+rgb+',0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*4,0,6.283); ctx.fill();
  ctx.fillStyle='rgba('+rgb+','+al+')'; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
}
var hasLS = 'letterSpacing' in ctx;
function label(text,x,y,align,al,opt){
  opt=opt||{}; ctx.font=(opt.w||500)+' '+(opt.size||11)+'px '+(opt.mono?'"JetBrains Mono",monospace':'"Barlow Semi Condensed","Barlow",sans-serif');
  if (hasLS) ctx.letterSpacing=(opt.ls!=null?opt.ls:2)+'px';
  ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,'+(.8*al)+')'; ctx.strokeText(text,x,y);
  ctx.fillStyle=opt.color||('rgba(255,255,255,'+al+')'); ctx.fillText(text,x,y);
}
var last=performance.now(), clock=0;
function draw(now){ try { drawFrame(now); } catch(e){ if (window.console) console.error(e); } requestAnimationFrame(draw); }
function drawFrame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now; if (!reduced) clock+=dt;
  if (!cur) return;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  // solar & cities
  solarA=approach(solarA, active==='solar'?1:0, dt); citiesA=approach(citiesA, (active==='digital'||active==='people'||active==='safe'||active==='health'||active==='outro')?1:0, dt);
  if (solarA>.01) SOLAR.forEach(function(s){ var p=S(s.b), tw=.55+.45*Math.sin(clock*s.sp*2+s.ph); glowDot(p[0],p[1],2.4,'255,226,180',solarA*Math.min(1,tw*1.15)); });
  if (citiesA>.01) CITIES.forEach(function(c,i){ var p=S(P(C[c[0]])), base=3+Math.sqrt(c[1])*9, ph=(clock*.55+i*.137)%1;
    ctx.strokeStyle='rgba(255,217,168,'+(citiesA*(1-ph)*.8)+')'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(p[0],p[1],base*(.4+ph*1.6),0,6.283); ctx.stroke();
    glowDot(p[0],p[1],1.4+Math.sqrt(c[1])*2.2,'255,217,168',citiesA*.95); });
  // routes
  ROUTES.forEach(function(r){
    r.a=approach(r.a, r.v.indexOf(active)>=0?1:0, dt); if (r.a<.01) return; routeLen(r);
    ctx.beginPath(); r.p.forEach(function(q,i){ var s=S(q); if(i) ctx.lineTo(s[0],s[1]); else ctx.moveTo(s[0],s[1]); });
    ctx.setLineDash(r.dash||[]); ctx.strokeStyle='rgba('+r.color+','+(.38*r.a)+')'; ctx.lineWidth=r.w; ctx.stroke(); ctx.setLineDash([]);
    for (var i=0;i<r.n;i++){ var t=((i/r.n)+clock*r.sp)%1, q=S(along(r,t)), fade=Math.min(1,t*8,(1-t)*8); glowDot(q[0],q[1],r.size,r.color,r.a*fade); }
  });
  // labels
  LABELS.forEach(function(l){ l.a=approach(l.a, l.v.indexOf(active)>=0?1:0, dt); if (l.a<.02) return; var p=S(l.b);
    if (l.city) label(T(l.t).toUpperCase(), p[0]+8, p[1]-9, 'left', l.a*.7, {size:9.5, ls:1.5, mono:1, w:400});
    else label(T(l.t).toUpperCase(), p[0], p[1], 'center', l.a*(l.w?.45:.6), {size:l.w?10:11.5, ls:l.w?3:2.4, w:l.w?400:500}); });
  // markers
  MARKERS.forEach(function(m){ m.a=approach(m.a, m.v.indexOf(active)>=0?1:0, dt); if (m.a<.02) return; var p=S(m.b), x=p[0], y=p[1], al=m.a; m.sx=x; m.sy=y;
    var rgb = m.ctx ? '125,138,160' : '240,58,78';
    if (m.kind==='chip'){ ctx.font='500 13px "JetBrains Mono",monospace'; if (hasLS) ctx.letterSpacing='0px'; var tw=ctx.measureText(m.chip).width+18;
      ctx.fillStyle='rgba(0,0,0,'+(.85*al)+')'; ctx.fillRect(x-tw/2,y-12,tw,24); ctx.strokeStyle='rgba('+rgb+','+al+')'; ctx.lineWidth=1.2; ctx.strokeRect(x-tw/2+.5,y-11.5,tw-1,23);
      ctx.fillStyle='rgba(255,255,255,'+al+')'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(m.chip,x,y+.5); m.hr=tw/2;
      if (T(m.name)) label(T(m.name).toUpperCase(), x, y+22, 'center', al*.75, {size:10, ls:2}); return; }
    var ph=(((clock*.6+m.b[0]*.001)%1)+1)%1;
    if (m.kind==='ring'||m.kind==='shield'){ var R0=(m.kind==='shield'?7:8)*m.sz;
      ctx.strokeStyle='rgba('+rgb+','+(al*(1-ph))+')'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(x,y,R0+ph*R0*2.2,0,6.283); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,'+al+')'; ctx.lineWidth=1.2; ctx.beginPath(); if (m.kind==='shield'){ ctx.rect(x-5,y-5,10,10); } else ctx.arc(x,y,R0*.7,0,6.283); ctx.stroke();
      glowDot(x,y,2.6,rgb,al); }
    else if (m.kind==='wind'){ ctx.save(); ctx.translate(x,y); ctx.strokeStyle='rgba(255,255,255,'+al+')'; ctx.lineWidth=1.4;
      for (var t=0;t<3;t++){ var a=clock*2.2+t*2.094; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11); ctx.stroke(); }
      ctx.restore(); glowDot(x,y,2.4,'240,58,78',al); }
    else { glowDot(x,y,3,'255,255,255',al); }
    m.hr=14;
    var nm=T(m.name); if (!nm) return; nm=nm.toUpperCase();
    var off=(m.kind==='dot'?10:16)*(m.sz>1?m.sz*.8:1);
    if (m.la==='r') label(nm,x+off,y,'left',al,{size:11.5}); else if (m.la==='l') label(nm,x-off,y,'right',al,{size:11.5});
    else if (m.la==='t') label(nm,x,y-off-4,'center',al,{size:11.5}); else label(nm,x,y+off+6,'center',al,{size:11.5});
  });
}

/* tooltips */
var tipFor=null;
function showTip(m,cx,cy){ tipFor=m; tipEl.innerHTML='<b></b><span></span>'; tipEl.firstChild.textContent=T(m.name)||T(m.chip)||''; tipEl.lastChild.textContent=T(m.tip);
  var w=Math.min(280,W-24); tipEl.style.width=w+'px'; var left=Math.max(12,Math.min(W-w-12,cx-w/2)); tipEl.style.left=left+'px';
  var h=tipEl.offsetHeight, top=cy-h-20; if (top<70) top=cy+22; tipEl.style.top=top+'px'; tipEl.classList.add('on'); }
function hideTip(){ tipFor=null; tipEl.classList.remove('on'); }
function hit(x,y){ var best=null, bd=1e9; MARKERS.forEach(function(m){ if (m.a<.5 || m.sx==null) return; var d=Math.hypot(m.sx-x,m.sy-y); if (d<(m.hr||14)+8 && d<bd){ bd=d; best=m; } }); return best; }
stage.addEventListener('pointermove', function(e){ var m=hit(e.clientX,e.clientY); stage.style.cursor=m?'pointer':''; if (m && e.pointerType==='mouse') showTip(m,m.sx,m.sy); else if (!m && e.pointerType==='mouse') hideTip(); });
stage.addEventListener('click', function(e){ var m=hit(e.clientX,e.clientY); if (m) showTip(m,m.sx,m.sy); else hideTip(); });

/* =====================================================================
   SCROLL WIRING
   ===================================================================== */
var stepEls=[], curStep=-1;
function collect(){ stepEls=$$('.step'); }
function pick(instant){
  var vh=innerHeight, idx=0;
  for (var i=0;i<stepEls.length;i++){ var r=stepEls[i].querySelector('.card').getBoundingClientRect(); if (r.top < vh*0.72) idx=i; }
  var se=document.scrollingElement, max=se.scrollHeight-vh; $('#progress').style.width=(max>0?se.scrollTop/max*100:0)+'%';
  if (idx===curStep) return; curStep=idx;
  var st=stepEls[idx], view=st.getAttribute('data-view'), chap=st.getAttribute('data-chap');
  stage.setAttribute('data-hero', idx===0?'1':'0');
  if (view!==active || instant) setView(view, instant);
  runFigures(st);
  $$('#nav a').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-chap')===chap); });
  var c=CHAPTERS.filter(function(x){ return x.k===chap; })[0], n=CHAPTERS.indexOf(c);
  $('#chap').textContent = c ? ((n+1<10?'0':'')+(n+1)+' / '+CHAPTERS.length+' · '+T(c.t)) : (lang==='pl'?'START':'START');
}
var ticking=false;
addEventListener('scroll', function(){ pick(); }, {passive:true});
addEventListener('resize', function(){ measure(); if (cur) apply(viewFor(active)); });

/* T+ clock since EU accession */
function tick(){
  var t0=Date.UTC(2004,4,1,0,0,0)-2*3600e3, now=Date.now(), s=Math.floor((now-t0)/1000);
  var d=new Date(now), y=d.getUTCFullYear()-2004; var ann=Date.UTC(2004+y,4,1)-2*3600e3; if (now<ann){ y--; ann=Date.UTC(2004+y,4,1)-2*3600e3; }
  var rem=Math.floor((now-ann)/1000), days=Math.floor(rem/86400), hh=Math.floor(rem%86400/3600), mm=Math.floor(rem%3600/60), ss=rem%60;
  function z(n){ return (n<10?'0':'')+n; }
  $('#tplus').textContent='T+ '+y+T(UI.y)+' '+days+T(UI.d)+' '+z(hh)+':'+z(mm)+':'+z(ss);
}
setInterval(tick,1000); tick();

/* language toggle */
function setLang(l){
  if (l===lang) return;
  var anchor = stepEls[curStep], offset = anchor ? anchor.getBoundingClientRect().top : 0, idx=curStep;
  lang=l; try{ localStorage.setItem('pl26-lang',l); }catch(e){}
  renderStory(); collect();
  var el=stepEls[idx]; if (el){ window.scrollTo(0, el.offsetTop - offset); }
  curStep=-1; pick(); updateMeta(); tick();
  stepEls.forEach(function(s,i){ if (i<=idx) runFigures(s); });
}
$$('.lang button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); }); });

/* boot */
renderStory(); collect(); measure();
setView('home', true);
pick(true);
requestAnimationFrame(draw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ /* canvas labels pick up the web fonts on the next frame */ });
})();
</script>
